spring.application.name=api-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Account Route
spring.cloud.gateway.mvc.routes[0].id=account-service
spring.cloud.gateway.mvc.routes[0].uri=lb://ACCOUNT
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/account/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

# Loan Route
spring.cloud.gateway.mvc.routes[1].id=loan-service
spring.cloud.gateway.mvc.routes[1].uri=lb://LOAN
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/loan/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

# Optional Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=INFO